name: Git AI

on:
  pull_request:
    types: [closed]

jobs:
  git-ai:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Install git-ai
        run: |
          curl -fsSL https://github.com/git-ai-project/git-ai/releases/download/v1.7.5/install.sh -o "$RUNNER_TEMP/install-git-ai.sh"
          echo "11ece07a73940f1c069543896b58265a8374e4595878176ca987117dc5f85cc3  $RUNNER_TEMP/install-git-ai.sh" | sha256sum --check
          bash "$RUNNER_TEMP/install-git-ai.sh"
          "$HOME/.git-ai/bin/git-ai" config set prompt_storage local
          "$HOME/.git-ai/bin/git-ai" config set telemetry_oss off
          echo "$HOME/.git-ai/bin" >> $GITHUB_PATH
      - name: Run git-ai
        id: run-git-ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git-ai ci github run
