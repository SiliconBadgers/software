<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accelerator model playground</title>
<style>
:root{
  color-scheme:light;
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7;
  --border:rgba(11,11,11,.10); --good:#006300; --crit:#d03b3b; --warn:#a86a00; --accent:#2a78d6; --wash:rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --on-s1:#fff; --on-s2:#fff; --on-s3:#0b0b0b; --on-s4:#0b0b0b; --on-s5:#0b0b0b; --on-s6:#fff; --on-s7:#fff; --on-s8:#fff;
  --div-neg:#2a78d6; --div-pos:#e34948; --font:system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
    --border:rgba(255,255,255,.10); --good:#0ca30c; --crit:#e66767; --warn:#fab219; --accent:#3987e5; --wash:rgba(255,255,255,.06);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --on-s1:#fff; --on-s2:#fff; --on-s3:#fff; --on-s4:#fff; --on-s5:#fff; --on-s6:#fff; --on-s7:#0b0b0b; --on-s8:#0b0b0b;
    --div-neg:#3987e5; --div-pos:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781; --grid:#2c2c2a; --axis:#383835;
  --border:rgba(255,255,255,.10); --good:#0ca30c; --crit:#e66767; --warn:#fab219; --accent:#3987e5; --wash:rgba(255,255,255,.06);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --on-s1:#fff; --on-s2:#fff; --on-s3:#fff; --on-s4:#fff; --on-s5:#fff; --on-s6:#fff; --on-s7:#0b0b0b; --on-s8:#0b0b0b;
  --div-neg:#3987e5; --div-pos:#e66767;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,select,input{font:inherit;color:var(--ink)}
button{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer}
button:hover{background:var(--wash)} button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
select,input[type=number],input[type=text]{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:4px 7px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px;padding:14px 20px 4px}
header h1{font-size:18px;margin:0;font-weight:650}
header .sub{color:var(--ink2);font-size:12.5px}
.spacer{flex:1}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 20px 12px;border-bottom:1px solid var(--border)}
.filters label{display:flex;gap:6px;align-items:center;color:var(--ink2)}
.layout{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:0;align-items:start}
aside{position:sticky;top:0;height:100vh;overflow:auto;padding:12px 14px 40px 20px;border-right:1px solid var(--border)}
main{padding:14px 22px 60px;min-width:0}
@media (max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}}
details.grp{border:1px solid var(--border);border-radius:8px;background:var(--surface);margin:0 0 8px}
details.grp>summary{padding:8px 10px;cursor:pointer;font-weight:600;list-style-position:inside}
details.grp .rows{padding:2px 10px 8px}
.ctl{padding:6px 0;border-top:1px solid var(--grid)}
.ctl:first-child{border-top:0}
.ctl .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ctl label.name{color:var(--ink);font-size:13px}
.ctl .unit{color:var(--muted);font-size:12px;margin-left:3px}
.ctl .help{color:var(--muted);font-size:11.5px;margin:1px 0 0}
.ctl.changed label.name::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px}
.ctl .in{display:flex;gap:8px;align-items:center}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.ctl input[type=number]{width:74px}
.caps{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:3px}
.caps label{display:flex;gap:4px;align-items:center;font-size:12.5px;color:var(--ink2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 14px;color:var(--ink2)}
.tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--ink);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card .label{color:var(--ink2);font-size:12.5px}
.card .value{font-size:26px;font-weight:650;margin:2px 0}
.card .value small{font-size:13px;font-weight:500;color:var(--ink2);margin-left:4px}
.card .note{color:var(--muted);font-size:12px}
.delta{font-size:12.5px;font-weight:600}
.delta.good{color:var(--good)} .delta.bad{color:var(--crit)} .delta.flat{color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--wash);margin-top:6px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--s1)}
.meter i.over{background:var(--crit)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.panel h2{font-size:14px;margin:0 0 2px;font-weight:650}
.panel .sub{color:var(--ink2);font-size:12.5px;margin:0 0 8px}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.panel .head button{font-size:12px;padding:2px 8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:6px 0 0;color:var(--ink2);font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend i.line{width:14px;height:3px;border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:4px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--ink2);font-weight:600;white-space:nowrap} td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.notice{border:1px solid var(--border);border-left:4px solid var(--crit);background:var(--surface);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.notice.warn{border-left-color:var(--warn)} .notice b{margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border-radius:999px;font-size:12.5px;padding:3px 11px}
.hint{color:var(--ink2);font-size:13px;margin:6px 0 0}
.busy .panel svg,.busy .cards{opacity:.55;transition:opacity .15s}
svg text{font-family:var(--font)}
.ax{stroke:var(--axis);stroke-width:1} .gr{stroke:var(--grid);stroke-width:1}
.tick{fill:var(--muted);font-size:11px} .lab{fill:var(--ink2);font-size:12px} .val{fill:var(--ink);font-size:12px;font-weight:600}
.seg:hover,.mk:hover{opacity:.82}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:0 4px 18px rgba(0,0,0,.18);max-width:320px}
#tip[hidden]{display:none} #tip .t{color:var(--ink2);margin-bottom:3px} #tip .r{display:flex;align-items:center;gap:8px}
#tip .r b{font-weight:650;color:var(--ink)} #tip .r span{color:var(--ink2)} #tip .k{width:12px;height:3px;border-radius:2px;flex:none}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--grid);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.about p{max-width:78ch;color:var(--ink2)} .about code{background:var(--wash);padding:1px 5px;border-radius:4px}
.form{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:end;margin-bottom:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--ink2)}
.form input[type=text]{width:190px}
.muted{color:var(--muted)}
.bar{display:inline-block;height:10px;border-radius:2px;vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<header>
  <h1>Accelerator model playground</h1>
  <span class="sub" id="runinfo">loading…</span>
  <span class="spacer"></span>
  <button id="theme" title="Switch light / dark">Theme</button>
</header>
<div class="filters" role="group" aria-label="Scope">
  <label>Workload <select id="graph"></select></label>
  <label>Start from <select id="preset"></select></label>
  <button id="reset" title="Discard every change and return to the preset">Reset</button>
  <button id="pin" title="Remember the current result; cards then show the change against it">Pin as baseline</button>
  <button id="unpin" hidden>Clear baseline</button>
  <button id="copy" title="Copy a link that restores this exact design">Copy link</button>
  <span id="changedcount" class="muted"></span>
</div>
<div class="layout">
  <aside id="controls" aria-label="Design parameters"></aside>
  <main id="main">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="explore" aria-selected="true">Explore</button>
      <button role="tab" data-tab="sweep" aria-selected="false">Sweep</button>
      <button role="tab" data-tab="ablation" aria-selected="false">Equations</button>
      <button role="tab" data-tab="sens" aria-selected="false">Sensitivity</button>
      <button role="tab" data-tab="about" aria-selected="false">About</button>
    </div>
    <section id="tab-explore"></section>
    <section id="tab-sweep" hidden></section>
    <section id="tab-ablation" hidden></section>
    <section id="tab-sens" hidden></section>
    <section id="tab-about" hidden class="about"></section>
  </main>
</div>
<div id="tip" hidden role="status"></div>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null) e.append(kid.nodeType ? kid : document.createTextNode(kid));
  return e;
}
const SVGNS = "http://www.w3.org/2000/svg";
function sv(tag, attrs, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}
const getp = (o, p) => p.split(".").reduce((a, k) => a[k], o);
const setp = (o, p, v) => { const ks = p.split("."), last = ks.pop(); ks.reduce((a, k) => a[k], o)[last] = v; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const nf = (n, d = 1) => n == null || !isFinite(n) ? "–" : n.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: 0 });
function fmtT(s) { if (s == null || !isFinite(s)) return "–"; const ms = s * 1e3; return ms >= 1000 ? nf(ms / 1e3, 2) + " s" : ms >= 100 ? nf(ms, 0) + " ms" : ms >= 10 ? nf(ms, 1) + " ms" : nf(ms, 2) + " ms"; }
function fmtB(b) { if (b == null) return "–"; const a = Math.abs(b); return a >= 2 ** 30 ? nf(b / 2 ** 30, 2) + " GB" : a >= 2 ** 20 ? nf(b / 2 ** 20, 1) + " MB" : a >= 1024 ? nf(b / 1024, 1) + " KB" : nf(b, 0) + " B"; }
const ENT = { matrix: 1, vector: 2, l1: 3, hbm: 4, recurrent: 5, dma: 6, scalar: 7, host: 8 };
const ENT_LABEL = { matrix: "Matrix units", vector: "Vector units", l1: "L1 bandwidth", hbm: "HBM bandwidth", recurrent: "Recurrence units", dma: "DMA engines", scalar: "Scalar fallback", host: "Host CPU" };
const entColor = (k) => `var(--s${ENT[k] || 1})`;

const tip = $("#tip");
function showTip(evt, title, rows) {
  tip.replaceChildren(el("div", { class: "t", text: title }), ...rows.map((r) => el("div", { class: "r" }, r.color ? el("i", { class: "k", style: `background:${r.color}` }) : null, el("b", { text: r.value }), el("span", { text: r.label }))));
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(evt.clientX + pad, innerWidth - w - 8) + "px";
  tip.style.top = Math.min(evt.clientY + pad, innerHeight - h - 8) + "px";
}
const hideTip = () => { tip.hidden = true; };
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

/* ---------- state ---------- */
let meta, state = { graph: "pp512-fa-on", preset: "accel-balanced", cfg: null, baseline: null, result: null, phase: "decode" };
let seq = 0, timer = null;
const presetCfg = () => meta.profiles.find((p) => p.name === state.preset).config;

/* ---------- controls ---------- */
const refresh = {};
function optLabel(o) { return typeof o === "number" ? String(o) : String(o).replace(/_/g, " "); }
function controlRow(c) {
  const row = el("div", { class: "ctl", "data-path": c.path });
  const nameLabel = el("label", { class: "name", for: "c-" + c.path, text: c.label }, c.unit ? el("span", { class: "unit", text: c.unit }) : null);
  const valueOut = el("span", { class: "muted" });
  row.append(el("div", { class: "top" }, nameLabel, valueOut));
  const commit = (v) => { setp(state.cfg, c.path, v); markChanged(); schedule(); };
  if (c.kind === "num" || c.kind === "int") {
    const range = el("input", { type: "range", min: c.min, max: c.max, step: c.step, id: "c-" + c.path, "aria-label": c.label });
    const box = el("input", { type: "number", min: c.min, max: c.max, step: c.step, "aria-label": c.label + " value" });
    const apply = (v) => { if (!isFinite(v)) return; v = c.kind === "int" ? Math.round(v) : v; range.value = v; box.value = v; valueOut.textContent = ""; commit(v); };
    range.addEventListener("input", () => apply(parseFloat(range.value)));
    box.addEventListener("change", () => apply(parseFloat(box.value)));
    row.append(el("div", { class: "in" }, range, box));
    refresh[c.path] = () => { const v = getp(state.cfg, c.path); range.value = v; box.value = v; };
  } else if (c.kind === "select") {
    const sel = el("select", { id: "c-" + c.path, "aria-label": c.label }, c.options.map((o, i) => el("option", { value: i, text: optLabel(o) })));
    sel.addEventListener("change", () => commit(c.options[+sel.value]));
    row.append(el("div", { class: "in" }, sel));
    refresh[c.path] = () => { const i = c.options.findIndex((o) => o === getp(state.cfg, c.path)); if (i >= 0) sel.value = i; else if (![...sel.options].some((o) => o.dataset.extra)) sel.append(el("option", { value: -1, "data-extra": 1, text: String(getp(state.cfg, c.path)) })), sel.value = -1; };
  } else if (c.kind === "bool") {
    const cb = el("input", { type: "checkbox", id: "c-" + c.path, "aria-label": c.label });
    cb.addEventListener("change", () => commit(cb.checked));
    row.querySelector(".top").prepend(cb);
    refresh[c.path] = () => { cb.checked = !!getp(state.cfg, c.path); };
  } else if (c.kind === "caps") {
    const wrap = el("div", { class: "caps" }), boxes = {};
    for (const o of c.options) {
      const cb = el("input", { type: "checkbox", value: o, "aria-label": c.label + ": " + o });
      cb.addEventListener("change", () => commit(c.options.filter((x) => boxes[x].checked)));
      boxes[o] = cb;
      wrap.append(el("label", {}, cb, o));
    }
    row.append(wrap);
    refresh[c.path] = () => { const cur = getp(state.cfg, c.path); for (const o of c.options) boxes[o].checked = cur.includes(o); };
  }
  if (c.help) row.append(el("p", { class: "help", text: c.help }));
  return row;
}
function buildControls() {
  const host = $("#controls");
  host.replaceChildren();
  for (const g of [...new Set(meta.controls.map((c) => c.group))]) {
    const d = el("details", { class: "grp" }, el("summary", { text: g }));
    if (["Compute units", "Memory"].includes(g)) d.open = true;
    const rows = el("div", { class: "rows" });
    for (const c of meta.controls.filter((c) => c.group === g)) rows.append(controlRow(c));
    d.append(rows);
    host.append(d);
  }
}
function syncControls() { for (const c of meta.controls) refresh[c.path](); markChanged(); }
function markChanged() {
  let n = 0;
  for (const c of meta.controls) {
    const diff = !same(getp(state.cfg, c.path), getp(presetCfg(), c.path));
    n += diff;
    const row = $(`.ctl[data-path="${c.path}"]`);
    if (row) row.classList.toggle("changed", diff);
  }
  $("#changedcount").textContent = n ? `${n} change${n > 1 ? "s" : ""} from “${state.preset}”` : "matches the preset";
}

/* ---------- evaluate & render ---------- */
function schedule() { clearTimeout(timer); timer = setTimeout(evaluate, 140); }
async function evaluate() {
  const id = ++seq;
  $("#tab-explore").classList.add("busy");
  try {
    const r = await api("/api/eval", { graph: state.graph, config: state.cfg, top_nodes: 8 });
    if (id !== seq) return;
    state.result = r; state.error = null;
  } catch (e) {
    if (id !== seq) return;
    state.error = e.message;
  }
  $("#tab-explore").classList.remove("busy");
  renderExplore();
}
function deltaEl(now, base, lowerIsBetter = true) {
  if (base == null || now == null || !isFinite(now) || !isFinite(base) || base === 0) return null;
  const pct = 100 * (now / base - 1);
  if (Math.abs(pct) < 0.05) return el("span", { class: "delta flat", text: "= pinned baseline" });
  const good = lowerIsBetter ? pct < 0 : pct > 0;
  return el("span", { class: "delta " + (good ? "good" : "bad"), text: `${pct < 0 ? "▼" : "▲"} ${pct > 0 ? "+" : ""}${nf(pct, 1)} % vs pinned` });
}
function card(label, value, unit, note, extra) {
  return el("div", { class: "card" }, el("div", { class: "label", text: label }), el("div", { class: "value" }, value, el("small", { text: unit })), note ? el("div", { class: "note", text: note }) : null, extra);
}
function meter(frac, over) { return el("div", { class: "meter" }, el("i", { class: over ? "over" : "", style: `width:${Math.min(100, Math.max(0, frac * 100))}%` })); }

const LEVERS = {
  l1: [{ label: "2× L1 banks", path: "l1.banks", f: (v) => v * 2 }, { label: "2× bytes per bank", path: "l1.bytes_per_bank_cycle", f: (v) => v * 2 }, { label: "Weights straight to the array", set: { "memory.weight_path": "direct" } }],
  hbm: [{ label: "2× HBM bandwidth", path: "hbm.gbs", f: (v) => v * 2 }, { label: "HBM efficiency +15 pts", path: "hbm.efficiency", f: (v) => Math.min(1, v + 0.15) }],
  matrix: [{ label: "2× matrix units", path: "matrix.count", f: (v) => Math.max(1, v * 2) }, { label: "Matrix efficiency +15 pts", path: "matrix.efficiency", f: (v) => Math.min(1, v + 0.15) }, { label: "2× clock", path: "clock_mhz", f: (v) => Math.min(1000, v * 2) }],
  vector: [{ label: "2× vector units", path: "vector.count", f: (v) => Math.max(1, v * 2) }, { label: "2× lanes", path: "vector.lanes", f: (v) => v * 2 }],
  recurrent: [{ label: "2× recurrence units", path: "recurrent.count", f: (v) => Math.max(1, v * 2) }, { label: "Chunked lowering", set: { "recurrent.lowering": "chunked" } }],
  dma: [{ label: "2× DMA engines", path: "dma.count", f: (v) => Math.max(1, v * 2) }, { label: "2× DMA bytes per cycle", path: "dma.bytes_per_cycle", f: (v) => v * 2 }],
  scalar: [{ label: "Add a matrix unit", path: "matrix.count", f: (v) => v + 1 }],
  host: [{ label: "Add a matrix unit", path: "matrix.count", f: (v) => v + 1 }],
};
function applyLever(l) {
  const sets = l.set || {};
